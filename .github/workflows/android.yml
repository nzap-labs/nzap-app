name: Android

on:
  push:
    branches: [main, 'ccr-*', 'phase-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # r27c, the NDK LTS the Tauri docs build against.
  NDK_VERSION: 27.2.12479018
  RUST_ANDROID_TARGETS: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

jobs:
  release-build:
    name: release build (4 ABIs, R8)
    # Dependabot PRs build only in nzap-labs/nzap-app, not in CI mirrors.
    if: github.actor != 'dependabot[bot]' || github.repository == 'nzap-labs/nzap-app'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner image ships the Android SDK and command-line tools.
      - name: Install the NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # One APK per ABI (arm64-v8a, armeabi-v7a, x86, x86_64), each with its
      # own version code, then the universal APK and the AAB for stores. The
      # Rust libraries are built once and reused by the later runs.
      - name: Build per-ABI release APKs
        run: npx tauri android build --ci --apk --split-per-abi
      - name: Build the universal APK and AAB
        run: npx tauri android build --ci --apk --aab

      - name: Verify the release artefacts
        run: scripts/verify-android-release.sh src-tauri/gen/android/app/build

      # The native plugin's JVM unit tests (the Keystore envelope format).
      # tauri.settings.gradle, written by the build above, includes it.
      - name: Plugin unit tests
        working-directory: src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-nzap-mobile:testReleaseUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: nzap-android-release
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nzap-android-r8-reports
          path: |
            src-tauri/gen/android/app/build/outputs/mapping/**
            src-tauri/gen/android/app/build/outputs/r8/**
          retention-days: 30

  emulator-e2e:
    name: emulator e2e (release + R8, x86_64)
    # Dependabot PRs build only in nzap-labs/nzap-app, not in CI mirrors.
    if: github.actor != 'dependabot[bot]' || github.repository == 'nzap-labs/nzap-app'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The emulator's userdata partition needs ~7.5 GB on top of the Rust,
      # NDK and Gradle builds; drop toolchains this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /opt/microsoft /opt/google/chrome
          # Preinstalled NDKs (the pinned one is installed below).
          sudo rm -rf "$ANDROID_HOME"/ndk/*
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install the NDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The release build (R8, not debuggable) plus the e2e feature: WebView
      # debugging for Playwright and Google pointed at the mock.
      - name: Build the e2e APK
        run: npx tauri android build --ci --apk --split-per-abi --target x86_64 --features e2e

      - name: Check the e2e APK is minified and not debuggable
        run: scripts/verify-android-release.sh src-tauri/gen/android/app/build --allow-e2e

      - name: Build the mock Google
        run: cargo build --release --locked -p nzap-mock-colab --bin mock-colab

      - name: Make room for the emulator
        run: |
          rm -rf src-tauri/gen/android/app/build/intermediates src-tauri/gen/android/app/build/tmp
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the suite on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-e2e.sh "$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-diagnostics
          path: e2e/android/artifacts
          retention-days: 7
