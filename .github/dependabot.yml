version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ['tauri*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ['@tauri-apps/*']
      tooling:
        patterns:
          ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'vite*', 'vitest', '@vitejs/*']
    ignore:
      # typescript-eslint pins a TypeScript range; take majors by hand once it supports them.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: gradle
    directory: /src-tauri/gen/android
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
